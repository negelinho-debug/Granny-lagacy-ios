name: Granny Legacy iOS - v7 MISSING TYPES FIX

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recover_logic:
    name: Recover IL2CPP gameplay logic
    runs-on: ubuntu-latest
    timeout-minutes: 150

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Install recovery dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            git \
            curl \
            jq \
            unzip \
            zip \
            xz-utils \
            binutils \
            file \
            python3

          rm -rf work tools recovered output recovered-project.tar.gz
          mkdir -p work tools recovered output

      - name: Download Granny Legacy APK from newest GitHub Release
        shell: bash
        run: |
          set -euo pipefail

          TAG="$(gh release list --limit 1 --json tagName --jq '.[0].tagName')"

          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "ERROR: No GitHub Release exists."
            exit 1
          fi

          mkdir -p work/release

          gh release download "$TAG" \
            --dir work/release \
            --pattern "*.apk"

          APK="$(
            find work/release -type f -iname '*.apk' -printf '%s %p\n' \
              | sort -nr \
              | head -1 \
              | cut -d' ' -f2-
          )"

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "ERROR: APK not found in newest Release."
            exit 1
          fi

          cp "$APK" work/GrannyLegacy.apk
          echo "APK=$PWD/work/GrannyLegacy.apk" | tee output/apk-path.txt

          ls -lh work/GrannyLegacy.apk
          sha256sum work/GrannyLegacy.apk | tee output/apk-sha256.txt

      - name: Extract APK + save original app icon
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work/android
          unzip -q work/GrannyLegacy.apk -d work/android

          DATA_DIR="$PWD/work/android/assets/bin/Data"
          test -d "$DATA_DIR"

          echo "$DATA_DIR" > output/data-dir.txt

          ICON="$PWD/work/android/res/oj.png"

          if [ ! -f "$ICON" ]; then
            ICON="$(
              python3 - <<'PY'
          from pathlib import Path
          try:
              from PIL import Image
          except Exception:
              print("")
              raise SystemExit

          best = None
          root = Path("work/android/res")
          for p in root.rglob("*.png"):
              try:
                  with Image.open(p) as im:
                      w, h = im.size
                  if w == h:
                      score = w * h
                      if best is None or score > best[0]:
                          best = (score, p)
              except Exception:
                  pass

          print(best[1] if best else "")
          PY
            )"
          fi

          if [ -z "${ICON:-}" ] || [ ! -f "$ICON" ]; then
            echo "ERROR: Original Granny Legacy icon not found."
            exit 1
          fi

          cp "$ICON" output/GrannyLegacy-AppIcon.png

          echo "ORIGINAL_ICON=$ICON"
          file output/GrannyLegacy-AppIcon.png
          ls -lh output/GrannyLegacy-AppIcon.png

      - name: Download latest Cpp2IL Linux x64
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p tools/cpp2il-download tools/cpp2il

          RELEASES="$(gh api repos/SamboyCoding/Cpp2IL/releases --paginate)"

          TAG="$(
            printf '%s' "$RELEASES" \
              | jq -r '
                  [
                    .[]
                    | select(.draft == false)
                    | select(any(.assets[]?;
                        (.name | test("Linux"; "i"))
                        and ((.name | test("ARM64|aarch64"; "i")) | not)
                      ))
                  ][0].tag_name
                '
          )"

          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "ERROR: Could not find a Cpp2IL Linux x64 release."
            exit 1
          fi

          echo "CPP2IL_TAG=$TAG"

          gh release download "$TAG" \
            -R SamboyCoding/Cpp2IL \
            -D tools/cpp2il-download \
            -p '*Linux*'

          echo "===== DOWNLOADED CPP2IL FILES ====="
          find tools/cpp2il-download -maxdepth 2 -type f -print

          ZIP="$(
            find tools/cpp2il-download -maxdepth 1 -type f \
              -iname '*Linux*.zip' \
              ! -iname '*ARM64*' \
              ! -iname '*aarch64*' \
              | sed -n '1p' || true
          )"

          if [ -n "$ZIP" ]; then
            unzip -q "$ZIP" -d tools/cpp2il
          else
            BIN="$(
              find tools/cpp2il-download -maxdepth 1 -type f \
                -iname '*Linux*' \
                ! -iname '*.zip' \
                ! -iname '*ARM64*' \
                ! -iname '*aarch64*' \
                | sed -n '1p' || true
            )"

            if [ -z "$BIN" ]; then
              echo "ERROR: Cpp2IL Linux x64 binary not found."
              exit 1
            fi

            cp "$BIN" tools/cpp2il/Cpp2IL
          fi

          CPP2IL="$(
            find tools/cpp2il -type f \
              \( -name 'Cpp2IL' -o -iname 'cpp2il' -o -iname 'Cpp2IL-*Linux*' \) \
              | sed -n '1p' || true
          )"

          if [ -z "$CPP2IL" ]; then
            CPP2IL="$(
              find tools/cpp2il -type f -maxdepth 4 \
                | while read -r f; do
                    if file "$f" | grep -qi 'executable'; then
                      echo "$f"
                      break
                    fi
                  done
            )"
          fi

          if [ -z "$CPP2IL" ] || [ ! -f "$CPP2IL" ]; then
            echo "ERROR: Cpp2IL executable not located."
            exit 1
          fi

          chmod +x "$CPP2IL"
          echo "$CPP2IL" > output/cpp2il-path.txt

          "$CPP2IL" --version || true
          "$CPP2IL" --list-output-formats | tee output/cpp2il-output-formats.txt || true

      - name: Recover executable IL from Android IL2CPP
        shell: bash
        run: |
          set -euo pipefail

          CPP2IL="$(cat output/cpp2il-path.txt)"
          APK="$PWD/work/GrannyLegacy.apk"

          rm -rf output/cpp2il-recovered
          mkdir -p output/cpp2il-recovered

          set +e
          "$CPP2IL" \
            --game-path "$APK" \
            --output-as dll_il_recovery \
            --output-to "$PWD/output/cpp2il-recovered" \
            --verbose \
            2>&1 | tee output/cpp2il-recovery.log
          RC=${PIPESTATUS[0]}
          set -e

          echo "CPP2IL_EXIT=$RC"

          if [ "$RC" -ne 0 ]; then
            echo "ERROR: Cpp2IL IL recovery failed."
            exit "$RC"
          fi

          echo "===== CPP2IL OUTPUT ====="
          find output/cpp2il-recovered -type f -printf '%s %p\n' \
            | sort -nr \
            | sed -n '1,200p'

          ASSEMBLY="$(
            find output/cpp2il-recovered -type f \
              -iname 'Assembly-CSharp.dll' \
              | sed -n '1p' || true
          )"

          if [ -z "$ASSEMBLY" ]; then
            echo "ERROR: Cpp2IL did not produce Assembly-CSharp.dll."
            exit 1
          fi

          echo "$ASSEMBLY" > output/recovered-assembly-csharp.txt
          ls -lh "$ASSEMBLY"

          grep -Ei \
            'analysis success rate|methods.*recovered|failed|warning|error' \
            output/cpp2il-recovery.log \
            | tail -200 \
            > output/cpp2il-summary.txt || true

      - name: Install ILSpy command line
        shell: bash
        run: |
          set -euo pipefail

          dotnet tool install --global ilspycmd || \
          dotnet tool update --global ilspycmd

          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          "$HOME/.dotnet/tools/ilspycmd" --version

      - name: Decompile recovered gameplay assemblies
        shell: bash
        run: |
          set -euo pipefail

          ILSPY="$HOME/.dotnet/tools/ilspycmd"
          ROOT="$PWD/output/cpp2il-recovered"
          DEST="$PWD/output/decompiled"

          rm -rf "$DEST"
          mkdir -p "$DEST"

          COUNT=0

          for NAME in Assembly-CSharp Assembly-CSharp-firstpass; do
            DLL="$(
              find "$ROOT" -type f -name "${NAME}.dll" -print \
                | sed -n '1p'
            )"

            if [ -z "$DLL" ] || [ ! -f "$DLL" ]; then
              echo "INFO: ${NAME}.dll was not produced by Cpp2IL."
              continue
            fi

            OUT="$DEST/$NAME"
            mkdir -p "$OUT"

            echo "DECOMPILE GAMEPLAY ONLY: $(basename "$DLL")"

            if "$ILSPY" -p -o "$OUT" "$DLL" \
              >> output/ilspy.log 2>&1; then
              COUNT=$((COUNT + 1))
            else
              echo "WARNING: ILSpy failed for $(basename "$DLL")" \
                | tee -a output/ilspy-failures.txt
            fi
          done

          echo "DECOMPILED_GAMEPLAY_ASSEMBLIES=$COUNT"
          echo "$COUNT" > output/decompiled-assembly-count.txt

          if [ "$COUNT" -lt 1 ]; then
            echo "ERROR: Assembly-CSharp could not be decompiled."
            exit 1
          fi

          find "$DEST" -type f -name '*.cs' -print > output/decompiled-files-all.txt
          sed -n '1,200p' output/decompiled-files-all.txt > output/decompiled-files-sample.txt

      - name: Download AssetRipper 2.0.0
        shell: bash
        run: |
          set -euo pipefail

          gh api repos/AssetRipper/AssetRipper/releases/tags/2.0.0 \
            --jq '.assets[].name' \
            > output/assetripper-assets.txt

          ASSET="$(
            grep -Ei '^AssetRipper_linux_(x64|amd64|64).*(\.tar\.xz|\.zip)$' \
              output/assetripper-assets.txt \
              | sed -n '1p' || true
          )"

          if [ -z "$ASSET" ]; then
            ASSET="$(
              grep -Ei 'linux.*(x64|amd64|64).*(\.tar\.xz|\.zip)$' \
                output/assetripper-assets.txt \
                | sed -n '1p' || true
            )"
          fi

          if [ -z "$ASSET" ]; then
            echo "ERROR: AssetRipper Linux package not found."
            exit 1
          fi

          gh release download 2.0.0 \
            -R AssetRipper/AssetRipper \
            -p "$ASSET" \
            -D tools

          mkdir -p tools/assetripper

          case "tools/$ASSET" in
            *.tar.xz) tar -xJf "tools/$ASSET" -C tools/assetripper ;;
            *.zip) unzip -q "tools/$ASSET" -d tools/assetripper ;;
            *) exit 1 ;;
          esac

          RIPPER="$(
            find tools/assetripper -type f \
              \( -name AssetRipper.GUI.Free -o -name AssetRipper.GUI -o -name AssetRipper \) \
              | sed -n '1p'
          )"

          if [ -z "$RIPPER" ]; then
            echo "ERROR: AssetRipper executable not found."
            exit 1
          fi

          chmod +x "$RIPPER"
          echo "$RIPPER" > output/assetripper-path.txt

      - name: Recover Unity project from APK assets
        shell: bash
        run: |
          set -euo pipefail

          RIPPER="$(cat output/assetripper-path.txt)"
          DATA_DIR="$(cat output/data-dir.txt)"
          EXPORT_DIR="$PWD/recovered/GrannyLegacy"
          PORT=3333

          mkdir -p "$EXPORT_DIR"

          "$RIPPER" --headless --port "$PORT" \
            > output/assetripper.log 2>&1 &
          PID=$!

          cleanup() {
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for i in $(seq 1 90); do
            if curl -fsS "http://127.0.0.1:${PORT}/" >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            tail -300 output/assetripper.log || true
            exit 1
          fi

          curl -fsS \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "Path=$DATA_DIR" \
            "http://127.0.0.1:${PORT}/LoadFolder" \
            -o output/load-response.txt

          curl -fsS \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "Path=$EXPORT_DIR" \
            --data-urlencode 'CreateSubfolder=false' \
            "http://127.0.0.1:${PORT}/Export/UnityProject" \
            -o output/export-response.txt

          cleanup
          trap - EXIT

          PROJECT=""
          if [ -d "$EXPORT_DIR/ExportedProject/Assets" ]; then
            PROJECT="$EXPORT_DIR/ExportedProject"
          elif [ -d "$EXPORT_DIR/Assets" ]; then
            PROJECT="$EXPORT_DIR"
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: AssetRipper project not found."
            exit 1
          fi

          echo "$PROJECT" > output/project-path.txt

          echo "SCENES=$(find "$PROJECT/Assets" -type f -name '*.unity' | wc -l)"
          echo "CS_FILES=$(find "$PROJECT/Assets" -type f -name '*.cs' | wc -l)"

      - name: Merge recovered method bodies into AssetRipper scripts
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="$(cat output/project-path.txt)"
          export PROJECT

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          from collections import defaultdict

          project = Path(os.environ["PROJECT"])
          assets = project / "Assets"
          decomp = Path("output/decompiled")

          roots = {
              "Assembly-CSharp": decomp / "Assembly-CSharp",
              "Assembly-CSharp-firstpass": decomp / "Assembly-CSharp-firstpass",
          }

          targets = defaultdict(list)
          for p in assets.rglob("*.cs"):
              targets[p.stem.lower()].append(p)

          patched = []
          added = []
          skipped_ambiguous = []
          skipped_unsafe = []

          def downgrade_file_scoped_namespace(content: str) -> str:
              m = re.search(r'(?m)^(\s*)namespace\s+([A-Za-z_][\w.]*)\s*;\s*$', content)
              if not m:
                  return content

              indent, ns = m.group(1), m.group(2)
              content = (
                  content[:m.start()]
                  + f"{indent}namespace {ns}\n{indent}{{"
                  + content[m.end():]
              )
              return content.rstrip() + f"\n{indent}}}\n"

          def safe_cs_filename(path: Path) -> bool:
              stem = path.stem
              if not re.fullmatch(r'[A-Za-z_][A-Za-z0-9_]*', stem):
                  return False
              if stem in {
                  "AssemblyInfo",
                  "GlobalUsings",
                  "Module",
                  "PrivateImplementationDetails",
              }:
                  return False
              return True

          for asm_name, root in roots.items():
              if not root.exists():
                  continue

              for src in root.rglob("*.cs"):
                  if not safe_cs_filename(src):
                      skipped_unsafe.append(src)
                      continue

                  key = src.stem.lower()
                  matches = targets.get(key, [])

                  try:
                      content = src.read_text(encoding="utf-8-sig", errors="replace")
                      content = downgrade_file_scoped_namespace(content)
                  except Exception as e:
                      print("READ_FAIL", src, e)
                      continue

                  if len(matches) == 1:
                      dst = matches[0]
                      dst.write_text(content, encoding="utf-8")
                      patched.append((src, dst))
                      continue

                  if len(matches) > 1:
                      skipped_ambiguous.append((src, matches))
                      continue

                  # Important v7 change:
                  # Cpp2IL/ILSpy often emits enums/helper types as separate files
                  # that AssetRipper never created. v6 ignored those files.
                  # That is why WaterBase.cs could not find WaterQuality.
                  rel = src.relative_to(root)

                  if asm_name == "Assembly-CSharp-firstpass":
                      dst = assets / "Plugins" / "RecoveredIL" / "Assembly-CSharp-firstpass" / rel
                  else:
                      dst = assets / "RecoveredIL" / "Assembly-CSharp" / rel

                  dst.parent.mkdir(parents=True, exist_ok=True)
                  dst.write_text(content, encoding="utf-8")
                  added.append((src, dst))
                  targets[key].append(dst)

          # Fallback for old Unity Standard Assets Water. If Cpp2IL did not
          # produce WaterQuality.cs at all, provide the original enum shape
          # required by WaterBase.cs.
          waterbase = list(assets.rglob("WaterBase.cs"))
          waterquality_found = False

          for p in assets.rglob("*.cs"):
              try:
                  s = p.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue
              if re.search(r'\benum\s+WaterQuality\b', s):
                  waterquality_found = True
                  break

          if waterbase and not waterquality_found:
              fallback = assets / "Plugins" / "RecoveredIL" / "UnityStandardAssets" / "Water" / "WaterQuality.cs"
              fallback.parent.mkdir(parents=True, exist_ok=True)
              fallback.write_text(
                  "namespace UnityStandardAssets.Water\n"
                  "{\n"
                  "    public enum WaterQuality\n"
                  "    {\n"
                  "        High = 2,\n"
                  "        Medium = 1,\n"
                  "        Low = 0\n"
                  "    }\n"
                  "}\n",
                  encoding="utf-8"
              )
              added.append((Path("<fallback>"), fallback))
              print("ADDED FALLBACK WaterQuality.cs ->", fallback)

          Path("output/patched-scripts.txt").write_text(
              "\n".join(f"{s} -> {d}" for s, d in patched),
              encoding="utf-8"
          )
          Path("output/added-recovered-types.txt").write_text(
              "\n".join(f"{s} -> {d}" for s, d in added),
              encoding="utf-8"
          )

          Path("output/logic-merge-summary.txt").write_text(
              f"patched={len(patched)}\n"
              f"added_missing_types={len(added)}\n"
              f"ambiguous={len(skipped_ambiguous)}\n"
              f"unsafe_skipped={len(skipped_unsafe)}\n",
              encoding="utf-8"
          )

          important = {
              "enemycontroller",
              "playerstatus",
              "inventory",
              "seedmanager",
              "pickray",
              "mobilefps",
              "beartraplogic",
              "grannyrobot",
          }

          restored_names = {d.stem.lower() for _, d in patched}
          restored_names |= {d.stem.lower() for _, d in added}
          important_restored = sorted(important & restored_names)

          Path("output/important-logic.txt").write_text(
              "\n".join(important_restored),
              encoding="utf-8"
          )

          print("PATCHED GAMEPLAY SCRIPTS", len(patched))
          print("ADDED MISSING TYPES", len(added))
          print("IMPORTANT_RESTORED", important_restored)

          if len(patched) + len(added) < 20:
              raise SystemExit(
                  "Too little gameplay code was recovered; refusing to build another asset-only IPA."
              )

          if len(important_restored) < 3:
              raise SystemExit(
                  "Core gameplay scripts were not recovered well enough; refusing to build broken IPA."
              )
          PY

          cat output/logic-merge-summary.txt
          cat output/important-logic.txt

      - name: Add original icon + iOS build script
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="$(cat output/project-path.txt)"

          cp output/GrannyLegacy-AppIcon.png \
            "$PROJECT/Assets/GrannyLegacyAppIcon.png"

          find "$PROJECT/Assets" -type f \
            \( -name '*.aar' -o -name '*.jar' -o -name '*.so' \) \
            -delete || true

          mkdir -p "$PROJECT/Assets/Editor"

          cat > "$PROJECT/Assets/Editor/GrannyLegacyIOSBuild.cs" <<'CS'
          using System;
          using System.IO;
          using System.Linq;
          using UnityEditor;
          using UnityEditor.Build.Reporting;
          using UnityEngine;

          public static class GrannyLegacyIOSBuild
          {
              private static void ConfigureOriginalIcon()
              {
                  const string iconPath = "Assets/GrannyLegacyAppIcon.png";

                  AssetDatabase.ImportAsset(iconPath, ImportAssetOptions.ForceUpdate);

                  Texture2D icon = AssetDatabase.LoadAssetAtPath<Texture2D>(iconPath);
                  if (icon == null)
                      throw new Exception("Original Granny Legacy icon failed to import.");

                  int[] sizes = PlayerSettings.GetIconSizesForTargetGroup(BuildTargetGroup.iOS);
                  if (sizes == null || sizes.Length == 0)
                  {
                      PlayerSettings.SetIconsForTargetGroup(
                          BuildTargetGroup.iOS,
                          new[] { icon }
                      );
                  }
                  else
                  {
                      Texture2D[] icons = Enumerable.Repeat(icon, sizes.Length).ToArray();
                      PlayerSettings.SetIconsForTargetGroup(
                          BuildTargetGroup.iOS,
                          icons
                      );
                  }

                  Debug.Log("GRANNY LEGACY: original Android icon configured for iOS.");
              }

              public static void PerformBuild()
              {
                  ConfigureOriginalIcon();

                  string[] scenes = EditorBuildSettings.scenes
                      .Where(s => s.enabled && File.Exists(s.path))
                      .Select(s => s.path)
                      .ToArray();

                  if (scenes.Length == 0)
                  {
                      scenes = AssetDatabase.FindAssets("t:Scene", new[] { "Assets" })
                          .Select(AssetDatabase.GUIDToAssetPath)
                          .Where(p => !string.IsNullOrWhiteSpace(p))
                          .ToArray();
                  }

                  if (scenes.Length == 0)
                      throw new Exception("No scenes found.");

                  PlayerSettings.productName = "Granny Legacy";
                  PlayerSettings.companyName = "GrannyLegacyIOSPort";

                  PlayerSettings.SetApplicationIdentifier(
                      BuildTargetGroup.iOS,
                      "com.grannylegacy.ios.port"
                  );

                  PlayerSettings.SetScriptingBackend(
                      BuildTargetGroup.iOS,
                      ScriptingImplementation.IL2CPP
                  );

                  PlayerSettings.iOS.targetOSVersionString = "15.0";
                  PlayerSettings.stripEngineCode = false;

                  string location = Path.GetFullPath(
                      Path.Combine(Application.dataPath, "../../build/iOS/GrannyLegacy-iOS")
                  );

                  if (Directory.Exists(location))
                      Directory.Delete(location, true);

                  Directory.CreateDirectory(location);

                  BuildReport report = BuildPipeline.BuildPlayer(
                      new BuildPlayerOptions
                      {
                          scenes = scenes,
                          locationPathName = location,
                          target = BuildTarget.iOS,
                          targetGroup = BuildTargetGroup.iOS,
                          options = BuildOptions.CleanBuildCache
                      }
                  );

                  Debug.Log(
                      "GRANNY LEGACY v7 BUILD RESULT=" + report.summary.result +
                      " errors=" + report.summary.totalErrors +
                      " warnings=" + report.summary.totalWarnings
                  );

                  if (report.summary.result != BuildResult.Succeeded)
                      throw new Exception("Unity iOS export failed: " + report.summary.result);
              }
          }
          CS

      - name: Pack recovered project with restored logic
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="$(cat output/project-path.txt)"

          tar \
            --exclude='Library' \
            --exclude='Temp' \
            --exclude='obj' \
            -czf recovered-project.tar.gz \
            -C "$(dirname "$PROJECT")" \
            "$(basename "$PROJECT")"

          ls -lh recovered-project.tar.gz

      - name: Upload logic-recovered Unity project
        uses: actions/upload-artifact@v4
        with:
          name: Granny-Legacy-v7-Recovered-Logic-Project
          path: recovered-project.tar.gz
          if-no-files-found: error
          compression-level: 0

      - name: Upload recovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Granny-Legacy-v7-Logic-Diagnostics
          path: |
            output/cpp2il-recovery.log
            output/cpp2il-summary.txt
            output/logic-merge-summary.txt
            output/important-logic.txt
            output/patched-scripts.txt
            output/added-recovered-types.txt
            output/ilspy.log
            output/ilspy-failures.txt
            output/assetripper.log
          if-no-files-found: warn
          compression-level: 6

  build_ios:
    name: Build Granny Legacy v7 iOS IPA
    needs: recover_logic
    runs-on: macos-latest
    timeout-minutes: 180

    env:
      GH_TOKEN: ${{ github.token }}
      UNITY_EMAIL: ${{ secrets.UNITY_USERNAME }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download recovered v6 project
        uses: actions/download-artifact@v4
        with:
          name: Granny-Legacy-v7-Recovered-Logic-Project
          path: recovered-download

      - name: Extract recovered project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p recovered-project output build

          ARCHIVE="$(
            find recovered-download -type f -name '*.tar.gz' | head -1
          )"

          test -f "$ARCHIVE"

          tar -xzf "$ARCHIVE" -C recovered-project

          PROJECT="$(
            find recovered-project -type f \
              -path '*/ProjectSettings/ProjectVersion.txt' \
              -print \
              | head -1 \
              | xargs -I{} dirname {} \
              | xargs -I{} dirname {}
          )"

          if [ -z "$PROJECT" ] || [ ! -d "$PROJECT/Assets" ]; then
            echo "ERROR: Unity project root not found."
            exit 1
          fi

          echo "$PROJECT" > output/project-path.txt

          cat "$PROJECT/ProjectSettings/ProjectVersion.txt"

          if [ -f "$PROJECT/Assets/GrannyLegacyAppIcon.png" ]; then
            sips -z 1024 1024 \
              "$PROJECT/Assets/GrannyLegacyAppIcon.png" \
              --out "$PROJECT/Assets/GrannyLegacyAppIcon.png" \
              >/dev/null
          fi

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Unity Hub for licensing
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @rage-against-the-pixel/unity-cli
          unity-cli hub-install --json
          unity-cli hub-version || true

      - name: Activate Unity Personal
        shell: bash
        run: |
          set -euo pipefail

          unity-cli activate-license \
            --license personal \
            --email "$UNITY_EMAIL" \
            --password "$UNITY_PASSWORD" \
            --json

          unity-cli license-context || true

      - name: Install official Unity CLI
        shell: bash
        run: |
          set -euo pipefail

          export UNITY_CLI_HOME="$PWD/tools/unity-official-cli"
          export UNITY_CLI_CHANNEL="beta"
          export UNITY_NON_INTERACTIVE=1
          export UNITY_NO_CONSENT_PROMPT=1
          export UNITY_NO_UPDATE_CHECK=1

          rm -rf "$UNITY_CLI_HOME"
          mkdir -p "$UNITY_CLI_HOME"

          curl -fsSL --retry 5 --retry-delay 3 \
            https://public-cdn.cloud.unity3d.com/hub/prod/cli/install.sh \
            -o /tmp/unity-cli-install.sh

          bash /tmp/unity-cli-install.sh

          echo "$UNITY_CLI_HOME/bin" >> "$GITHUB_PATH"

          UNITY="$UNITY_CLI_HOME/bin/unity"
          test -x "$UNITY"
          "$UNITY" --version

      - name: Install Unity 2022.3.62f2 + iOS module
        shell: bash
        run: |
          set -euo pipefail

          UNITY="$PWD/tools/unity-official-cli/bin/unity"
          INSTALL_ROOT="$HOME/UnityEditors"
          VERSION="2022.3.62f2"

          export UNITY_NON_INTERACTIVE=1
          export UNITY_NO_CONSENT_PROMPT=1
          export UNITY_NO_UPDATE_CHECK=1

          mkdir -p "$INSTALL_ROOT"

          "$UNITY" --non-interactive --no-banner --no-color \
            editors install-path --set "$INSTALL_ROOT"

          "$UNITY" --non-interactive --no-banner --no-color \
            install "$VERSION" \
            --module ios \
            --no-child-modules \
            --yes \
            --accept-eula \
            2>&1 | tee output/unity-install.log

          UNITY_BIN="$(
            find "$INSTALL_ROOT" -type f \
              -path '*/Unity.app/Contents/MacOS/Unity' \
              -print \
              | sed -n '1p'
          )"

          test -x "$UNITY_BIN"
          echo "$UNITY_BIN" > output/unity-bin.txt

      - name: Unity compile + export Xcode
        id: unity_build
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail

          UNITY_BIN="$(cat output/unity-bin.txt)"
          PROJECT="$(cat output/project-path.txt)"

          "$UNITY_BIN" \
            -batchmode \
            -nographics \
            -quit \
            -projectPath "$PROJECT" \
            -buildTarget iOS \
            -executeMethod GrannyLegacyIOSBuild.PerformBuild \
            -logFile - \
            2>&1 | tee output/unity-build.log

          RC=${PIPESTATUS[0]}
          echo "$RC" > output/unity-exit-code.txt
          exit "$RC"

      - name: Extract Unity errors
        if: always()
        shell: bash
        run: |
          set +e

          grep -E \
            'error CS[0-9]+|Scripts have compiler errors|NullReferenceException|MissingMethodException|BuildFailedException|Exception:|error:' \
            output/unity-build.log \
            | tail -500 \
            > output/error-summary.txt || true

          cat output/error-summary.txt || true

      - name: Locate exported Xcode project
        id: locate_xcode
        if: steps.unity_build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          PROJ="$(
            find "$PWD" -type d -name 'Unity-iPhone.xcodeproj' -print 2>/dev/null \
              | sed -n '1p' || true
          )"

          if [ -z "$PROJ" ]; then
            PROJ="$(
              find "$PWD" -type d -name '*.xcodeproj' -print 2>/dev/null \
                | grep -v '/DerivedData/' \
                | sed -n '1p' || true
            )"
          fi

          if [ -z "$PROJ" ] || [ ! -d "$PROJ" ]; then
            echo "ERROR: Xcode project not found."
            exit 1
          fi

          XCODE_DIR="$(dirname "$PROJ")"
          WORKSPACE="$(find "$XCODE_DIR" -maxdepth 2 -type d -name '*.xcworkspace' | head -1 || true)"

          echo "$XCODE_DIR" > output/xcode-dir.txt
          echo "$PROJ" > output/xcode-project.txt
          echo "$WORKSPACE" > output/xcode-workspace.txt

          if [ -n "$WORKSPACE" ] && [ -d "$WORKSPACE" ]; then
            xcodebuild -workspace "$WORKSPACE" -list
          else
            xcodebuild -project "$PROJ" -list
          fi

      - name: Build unsigned iOS app
        id: xcode_build
        if: steps.unity_build.outcome == 'success' && steps.locate_xcode.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail

          PROJ="$(cat output/xcode-project.txt)"
          WORKSPACE="$(cat output/xcode-workspace.txt)"

          rm -rf DerivedData
          mkdir -p DerivedData

          COMMON_ARGS=(
            -scheme Unity-iPhone
            -configuration Release
            -sdk iphoneos
            -destination 'generic/platform=iOS'
            -derivedDataPath "$PWD/DerivedData"
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGN_IDENTITY=
            DEVELOPMENT_TEAM=
            ONLY_ACTIVE_ARCH=YES
            ARCHS=arm64
          )

          if [ -n "$WORKSPACE" ] && [ -d "$WORKSPACE" ]; then
            xcodebuild \
              -workspace "$WORKSPACE" \
              "${COMMON_ARGS[@]}" \
              build \
              2>&1 | tee output/xcodebuild.log
          else
            xcodebuild \
              -project "$PROJ" \
              "${COMMON_ARGS[@]}" \
              build \
              2>&1 | tee output/xcodebuild.log
          fi

          RC=${PIPESTATUS[0]}
          echo "$RC" > output/xcode-exit-code.txt
          exit "$RC"

      - name: Package unsigned v7 IPA
        if: steps.unity_build.outcome == 'success' && steps.xcode_build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            find "$PWD/DerivedData/Build/Products" \
              -type d -name '*.app' \
              -path '*Release-iphoneos*' \
              | sed -n '1p'
          )"

          if [ -z "$APP" ]; then
            echo "ERROR: built .app not found."
            exit 1
          fi

          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/

          /usr/bin/zip -qry Granny-Legacy-iOS-v7-UNSIGNED.ipa Payload

          ls -lh Granny-Legacy-iOS-v7-UNSIGNED.ipa

          /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleIdentifier' \
            "$APP/Info.plist" \
            | tee output/bundle-id.txt

      - name: Upload v7 unsigned IPA
        if: steps.unity_build.outcome == 'success' && steps.xcode_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Granny-Legacy-iOS-v7-UNSIGNED
          path: Granny-Legacy-iOS-v7-UNSIGNED.ipa
          if-no-files-found: error
          compression-level: 0

      - name: Upload v7 build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Granny-Legacy-iOS-v7-Build-Diagnostics
          path: |
            output
          if-no-files-found: warn
          compression-level: 6

      - name: Final status
        if: always()
        shell: bash
        run: |
          echo "Unity outcome: ${{ steps.unity_build.outcome }}"
          echo "Xcode outcome: ${{ steps.xcode_build.outcome }}"

          if [ "${{ steps.unity_build.outcome }}" != "success" ]; then
            echo "V7 RESULT: recovered gameplay code did not compile yet."
            echo "Use Granny-Legacy-iOS-v7-Build-Diagnostics for the next fix."
            exit 1
          fi

          if [ "${{ steps.xcode_build.outcome }}" != "success" ]; then
            echo "V7 RESULT: Unity export passed, but Xcode build failed."
            exit 1
          fi

          echo "V7 RESULT: unsigned IPA created with recovered gameplay logic + original icon."

      - name: Return Unity license
        if: always()
        shell: bash
        run: |
          if command -v unity-cli >/dev/null 2>&1; then
            unity-cli return-license --license personal || true
          fi
