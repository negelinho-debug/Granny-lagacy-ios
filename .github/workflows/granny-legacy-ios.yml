name: Granny Legacy iOS - v3 XCODE PATH FIX

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build_ios:
    name: Download recovered project + try first iOS IPA
    runs-on: macos-latest
    timeout-minutes: 150

    env:
      GH_TOKEN: ${{ github.token }}
      UNITY_EMAIL: ${{ secrets.UNITY_USERNAME }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find latest successful v1 run
        shell: bash
        run: |
          set -euo pipefail

          RUN_ID="$(
            gh run list \
              --workflow granny-legacy-ios.yml \
              --status success \
              --limit 20 \
              --json databaseId,name,displayTitle,createdAt \
              --jq '.[0].databaseId'
          )"

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "ERROR: Could not find a successful previous run."
            exit 1
          fi

          echo "SOURCE_RUN_ID=$RUN_ID"
          echo "$RUN_ID" > source-run-id.txt

      - name: Download recovered Unity project from v1
        shell: bash
        run: |
          set -euo pipefail

          RUN_ID="$(cat source-run-id.txt)"

          rm -rf recovered-download il2cpp-download recovered-project build output DerivedData
          mkdir -p recovered-download il2cpp-download recovered-project build output

          gh run download "$RUN_ID" \
            -n "Granny-Legacy-Recovered-Unity-v1" \
            -D recovered-download

          # IL2CPP dump is downloaded too for diagnostics.
          gh run download "$RUN_ID" \
            -n "Granny-Legacy-IL2CPP-Dump-v1" \
            -D il2cpp-download || true

          echo "===== RECOVERED ARTIFACT ====="
          find recovered-download -maxdepth 3 -type f -print

          ARCHIVE="$(
            find recovered-download -type f \
              \( -name '*.tar.gz' -o -name '*.tgz' \) \
              | head -1
          )"

          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: recovered project archive not found."
            exit 1
          fi

          tar -xzf "$ARCHIVE" -C recovered-project

          PROJECT="$(
            find recovered-project -type f \
              -path '*/ProjectSettings/ProjectVersion.txt' \
              -print \
              | head -1 \
              | xargs -I{} dirname {} \
              | xargs -I{} dirname {}
          )"

          if [ -z "$PROJECT" ] || [ ! -d "$PROJECT/Assets" ]; then
            echo "ERROR: Unity project root not found."
            find recovered-project -maxdepth 5 -print | head -500
            exit 1
          fi

          echo "$PROJECT" > output/project-path.txt

          echo "===== PROJECT ====="
          cat "$PROJECT/ProjectSettings/ProjectVersion.txt"
          echo "Scenes: $(find "$PROJECT/Assets" -type f -name '*.unity' | wc -l)"
          echo "C# files: $(find "$PROJECT/Assets" -type f -name '*.cs' | wc -l)"
          echo "DLLs: $(find "$PROJECT/Assets" -type f -name '*.dll' | wc -l)"

      - name: Remove Android-only native plugins
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$(cat output/project-path.txt)"

          echo "===== ANDROID PLUGINS BEFORE CLEAN ====="
          find "$PROJECT/Assets" -type f \
            \( -name '*.aar' -o -name '*.jar' -o -name '*.so' \) \
            -print | head -300 || true

          find "$PROJECT/Assets" -type f \
            \( -name '*.aar' -o -name '*.jar' -o -name '*.so' \) \
            -delete || true

          # Remove empty Android plugin directories only if they exist.
          find "$PROJECT/Assets" -type d -empty -delete || true

      - name: Add iOS build probe script
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$(cat output/project-path.txt)"

          mkdir -p "$PROJECT/Assets/Editor"

          cat > "$PROJECT/Assets/Editor/GrannyLegacyIOSBuild.cs" <<'CS'
          using System;
          using System.IO;
          using System.Linq;
          using UnityEditor;
          using UnityEditor.Build.Reporting;
          using UnityEngine;

          public static class GrannyLegacyIOSBuild
          {
              public static void PerformBuild()
              {
                  string[] scenes = EditorBuildSettings.scenes
                      .Where(s => s.enabled && File.Exists(s.path))
                      .Select(s => s.path)
                      .ToArray();

                  if (scenes.Length == 0)
                  {
                      scenes = AssetDatabase.FindAssets("t:Scene", new[] { "Assets" })
                          .Select(AssetDatabase.GUIDToAssetPath)
                          .Where(p => !string.IsNullOrWhiteSpace(p))
                          .ToArray();
                  }

                  if (scenes.Length == 0)
                      throw new Exception("No Unity scenes found.");

                  Debug.Log("GRANNY LEGACY iOS: scenes=" + scenes.Length);
                  foreach (string scene in scenes)
                      Debug.Log("SCENE: " + scene);

                  PlayerSettings.productName = "Granny Legacy";
                  PlayerSettings.companyName = "GrannyLegacyIOSPort";
                  PlayerSettings.SetApplicationIdentifier(
                      BuildTargetGroup.iOS,
                      "com.grannylegacy.ios.port"
                  );

                  PlayerSettings.SetScriptingBackend(
                      BuildTargetGroup.iOS,
                      ScriptingImplementation.IL2CPP
                  );

                  PlayerSettings.iOS.targetOSVersionString = "15.0";
                  PlayerSettings.stripEngineCode = false;

                  string location = Path.GetFullPath(
                      Path.Combine(Application.dataPath, "../../build/iOS/GrannyLegacy-iOS")
                  );

                  if (Directory.Exists(location))
                      Directory.Delete(location, true);

                  Directory.CreateDirectory(location);

                  BuildPlayerOptions options = new BuildPlayerOptions
                  {
                      scenes = scenes,
                      locationPathName = location,
                      target = BuildTarget.iOS,
                      targetGroup = BuildTargetGroup.iOS,
                      options = BuildOptions.CleanBuildCache
                  };

                  BuildReport report = BuildPipeline.BuildPlayer(options);

                  Debug.Log(
                      "GRANNY LEGACY iOS BUILD RESULT: " +
                      report.summary.result +
                      " errors=" + report.summary.totalErrors +
                      " warnings=" + report.summary.totalWarnings
                  );

                  if (report.summary.result != BuildResult.Succeeded)
                      throw new Exception("Unity iOS export failed: " + report.summary.result);
              }
          }
          CS

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Unity Hub for licensing
        shell: bash
        run: |
          set -euo pipefail

          npm install -g @rage-against-the-pixel/unity-cli
          unity-cli hub-install --json
          unity-cli hub-version || true

      - name: Activate Unity Personal
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${UNITY_EMAIL:-}" ] || [ -z "${UNITY_PASSWORD:-}" ]; then
            echo "ERROR: UNITY_USERNAME / UNITY_PASSWORD GitHub Secrets are missing."
            exit 1
          fi

          unity-cli activate-license \
            --license personal \
            --email "$UNITY_EMAIL" \
            --password "$UNITY_PASSWORD" \
            --json

          unity-cli license-context || true

      - name: Install official Unity CLI
        shell: bash
        run: |
          set -euo pipefail

          export UNITY_CLI_HOME="$PWD/tools/unity-official-cli"
          export UNITY_CLI_CHANNEL="beta"
          export UNITY_NON_INTERACTIVE=1
          export UNITY_NO_CONSENT_PROMPT=1
          export UNITY_NO_UPDATE_CHECK=1

          rm -rf "$UNITY_CLI_HOME"
          mkdir -p "$UNITY_CLI_HOME"

          curl -fsSL --retry 5 --retry-delay 3 \
            https://public-cdn.cloud.unity3d.com/hub/prod/cli/install.sh \
            -o /tmp/unity-cli-install.sh

          bash /tmp/unity-cli-install.sh

          echo "$UNITY_CLI_HOME/bin" >> "$GITHUB_PATH"

          UNITY="$UNITY_CLI_HOME/bin/unity"
          test -x "$UNITY"
          "$UNITY" --version

      - name: Install Unity 2022.3.62f2 + iOS module
        shell: bash
        run: |
          set -euo pipefail

          UNITY="$PWD/tools/unity-official-cli/bin/unity"
          INSTALL_ROOT="$HOME/UnityEditors"
          VERSION="2022.3.62f2"

          export UNITY_NON_INTERACTIVE=1
          export UNITY_NO_CONSENT_PROMPT=1
          export UNITY_NO_UPDATE_CHECK=1

          mkdir -p "$INSTALL_ROOT"

          "$UNITY" --non-interactive --no-banner --no-color \
            editors install-path --set "$INSTALL_ROOT"

          "$UNITY" --non-interactive --no-banner --no-color \
            install "$VERSION" \
            --module ios \
            --no-child-modules \
            --yes \
            --accept-eula \
            2>&1 | tee output/unity-install.log

          UNITY_BIN="$(
            find "$INSTALL_ROOT" -type f \
              -path '*/Unity.app/Contents/MacOS/Unity' \
              -print \
              | head -1
          )"

          if [ -z "$UNITY_BIN" ] || [ ! -x "$UNITY_BIN" ]; then
            echo "ERROR: Unity executable not found."
            find "$INSTALL_ROOT" -maxdepth 6 -print | head -500
            exit 1
          fi

          echo "$UNITY_BIN" > output/unity-bin.txt
          echo "UNITY_BIN=$UNITY_BIN"

          UNITY_APP_ROOT="$(dirname "$(dirname "$(dirname "$UNITY_BIN")")")"
          EDITOR_ROOT="$(dirname "$UNITY_APP_ROOT")"

          IOS_SUPPORT="$EDITOR_ROOT/PlaybackEngines/iOSSupport"
          if [ ! -d "$IOS_SUPPORT" ]; then
            IOS_SUPPORT="$UNITY_APP_ROOT/Contents/PlaybackEngines/iOSSupport"
          fi

          if [ ! -d "$IOS_SUPPORT" ]; then
            echo "ERROR: iOSSupport is missing."
            exit 1
          fi

          echo "IOS_SUPPORT=$IOS_SUPPORT"

      - name: Unity compile + export Xcode
        id: unity_build
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail

          UNITY_BIN="$(cat output/unity-bin.txt)"
          PROJECT="$(cat output/project-path.txt)"

          "$UNITY_BIN" \
            -batchmode \
            -nographics \
            -quit \
            -projectPath "$PROJECT" \
            -buildTarget iOS \
            -executeMethod GrannyLegacyIOSBuild.PerformBuild \
            -logFile - \
            2>&1 | tee output/unity-build.log

          RC=${PIPESTATUS[0]}
          echo "UNITY_EXIT=$RC"
          echo "$RC" > output/unity-exit-code.txt

          exit "$RC"

      - name: Extract important Unity errors
        if: always()
        shell: bash
        run: |
          set +e

          echo "===== COMPILER / BUILD ERRORS =====" | tee output/error-summary.txt

          grep -E \
            'error CS[0-9]+|Scripts have compiler errors|NullReferenceException|MissingMethodException|DllNotFoundException|BuildFailedException|Exception:|FAILURE|error:' \
            output/unity-build.log \
            | tail -400 \
            | tee -a output/error-summary.txt || true

          echo "===== END ERROR SUMMARY =====" | tee -a output/error-summary.txt

      - name: Locate exported Xcode project
        id: locate_xcode
        if: steps.unity_build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          echo "===== SEARCHING FOR UNITY XCODE EXPORT ====="

          PROJ="$(
            find "$PWD" -type d -name 'Unity-iPhone.xcodeproj' -print 2>/dev/null \
              | head -1 || true
          )"

          if [ -z "$PROJ" ]; then
            PROJ="$(
              find "$PWD" -type d -name '*.xcodeproj' -print 2>/dev/null \
                | grep -v '/DerivedData/' \
                | head -1 || true
            )"
          fi

          if [ -z "$PROJ" ] || [ ! -d "$PROJ" ]; then
            echo "ERROR: Xcode output not found anywhere under workspace."
            echo "===== POSSIBLE BUILD OUTPUT DIRECTORIES ====="
            find "$PWD" -maxdepth 10 -type d \
              \( -iname '*ios*' -o -iname '*build*' -o -iname '*.xcodeproj' \) \
              -print | head -500 || true
            exit 1
          fi

          XCODE_DIR="$(dirname "$PROJ")"
          WORKSPACE="$(find "$XCODE_DIR" -maxdepth 2 -type d -name '*.xcworkspace' | head -1 || true)"

          echo "$XCODE_DIR" > output/xcode-dir.txt
          echo "$PROJ" > output/xcode-project.txt
          echo "$WORKSPACE" > output/xcode-workspace.txt

          echo "XCODE_DIR=$XCODE_DIR"
          echo "PROJ=$PROJ"
          echo "WORKSPACE=${WORKSPACE:-NONE}"

          rm -rf xcode-output
          mkdir -p xcode-output
          ditto "$XCODE_DIR" xcode-output/GrannyLegacy-iOS

          if [ -n "$WORKSPACE" ] && [ -d "$WORKSPACE" ]; then
            xcodebuild -workspace "$WORKSPACE" -list
          else
            xcodebuild -project "$PROJ" -list
          fi

      - name: Build unsigned iOS app
        id: xcode_build
        if: steps.unity_build.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail

          PROJ="$(cat output/xcode-project.txt)"
          WORKSPACE="$(cat output/xcode-workspace.txt)"

          rm -rf DerivedData
          mkdir -p DerivedData

          COMMON_ARGS=(
            -scheme Unity-iPhone
            -configuration Release
            -sdk iphoneos
            -destination 'generic/platform=iOS'
            -derivedDataPath "$PWD/DerivedData"
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGN_IDENTITY=
            DEVELOPMENT_TEAM=
            ONLY_ACTIVE_ARCH=YES
            ARCHS=arm64
          )

          if [ -n "$WORKSPACE" ] && [ -d "$WORKSPACE" ]; then
            xcodebuild \
              -workspace "$WORKSPACE" \
              "${COMMON_ARGS[@]}" \
              build \
              2>&1 | tee output/xcodebuild.log
          else
            xcodebuild \
              -project "$PROJ" \
              "${COMMON_ARGS[@]}" \
              build \
              2>&1 | tee output/xcodebuild.log
          fi

          RC=${PIPESTATUS[0]}
          echo "XCODE_EXIT=$RC"
          echo "$RC" > output/xcode-exit-code.txt
          exit "$RC"

      - name: Package unsigned IPA
        if: steps.unity_build.outcome == 'success' && steps.xcode_build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            find "$PWD/DerivedData/Build/Products" \
              -type d -name '*.app' \
              -path '*Release-iphoneos*' \
              | head -1
          )"

          if [ -z "$APP" ]; then
            echo "ERROR: built .app not found."
            exit 1
          fi

          echo "APP=$APP"

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/

          /usr/bin/zip -qry Granny-Legacy-iOS-v3-UNSIGNED.ipa Payload

          echo "===== IPA ====="
          ls -lh Granny-Legacy-iOS-v3-UNSIGNED.ipa

          APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          echo "APP_BUNDLE_ID=$APP_ID" | tee output/bundle-id.txt

          FRAMEWORK_PLIST="$APP/Frameworks/UnityFramework.framework/Info.plist"
          if [ -f "$FRAMEWORK_PLIST" ]; then
            FRAMEWORK_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$FRAMEWORK_PLIST")"
            echo "UNITYFRAMEWORK_BUNDLE_ID=$FRAMEWORK_ID" | tee -a output/bundle-id.txt
          fi

      - name: Upload first unsigned IPA
        if: steps.unity_build.outcome == 'success' && steps.xcode_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Granny-Legacy-iOS-v3-UNSIGNED
          path: Granny-Legacy-iOS-v3-UNSIGNED.ipa
          if-no-files-found: error
          compression-level: 0

      - name: Upload Xcode project
        if: steps.locate_xcode.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Granny-Legacy-iOS-v3-Xcode
          path: xcode-output/GrannyLegacy-iOS
          if-no-files-found: warn
          compression-level: 6

      - name: Upload v2 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Granny-Legacy-iOS-v3-Diagnostics
          path: |
            output
          if-no-files-found: warn
          compression-level: 6

      - name: Final status
        if: always()
        shell: bash
        run: |
          echo "Unity outcome: ${{ steps.unity_build.outcome }}"
          echo "Xcode outcome: ${{ steps.xcode_build.outcome }}"

          if [ "${{ steps.unity_build.outcome }}" != "success" ]; then
            echo "V3 RESULT: Unity recovered project does not compile/export yet."
            echo "Download Granny-Legacy-iOS-v3-Diagnostics and inspect error-summary.txt."
            exit 1
          fi

          if [ "${{ steps.xcode_build.outcome }}" != "success" ]; then
            echo "V3 RESULT: Unity exported Xcode, but Xcode build failed."
            echo "Download Granny-Legacy-iOS-v3-Diagnostics."
            exit 1
          fi

          echo "V3 RESULT: FIRST UNSIGNED IPA CREATED."

      - name: Return Unity license
        if: always()
        shell: bash
        run: |
          if command -v unity-cli >/dev/null 2>&1; then
            unity-cli return-license --license personal || true
          fi
